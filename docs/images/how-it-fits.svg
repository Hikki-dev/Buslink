<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Roboto, Helvetica, Arial, sans-serif">
  <title>How BusLink fits together</title>
  <desc>The Flutter app talks to Firebase Authentication, Cloud Firestore and Cloud Messaging directly. Payments go to Stripe from the phone, or through small Vercel functions on the web. A Firebase Cloud Function sends refunds to Stripe.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b5b5c"/></marker>
  </defs>
  <rect width="900" height="470" fill="#ffffff"/>

  <!-- App -->
  <rect x="30" y="160" width="230" height="150" rx="16" fill="#BA181B"/>
  <text x="145" y="205" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">BusLink app</text>
  <text x="145" y="235" text-anchor="middle" font-size="15" fill="#fff">Flutter</text>
  <text x="145" y="258" text-anchor="middle" font-size="14" fill="#ffe3e4">Passenger · Conductor · Admin</text>
  <text x="145" y="280" text-anchor="middle" font-size="14" fill="#ffe3e4">Web · Android · iOS · Desktop</text>

  <!-- Firebase -->
  <rect x="360" y="20" width="250" height="52" rx="12" fill="#fff4d6" stroke="#e0b84a" stroke-width="2"/>
  <text x="485" y="52" text-anchor="middle" font-size="17" font-weight="700" fill="#5a4300">Firebase Authentication</text>
  <rect x="360" y="100" width="250" height="52" rx="12" fill="#fff4d6" stroke="#e0b84a" stroke-width="2"/>
  <text x="485" y="125" text-anchor="middle" font-size="17" font-weight="700" fill="#5a4300">Cloud Firestore</text>
  <text x="485" y="144" text-anchor="middle" font-size="12.5" fill="#5a4300">trips · tickets · routes · users · refunds</text>
  <rect x="360" y="180" width="250" height="52" rx="12" fill="#fff4d6" stroke="#e0b84a" stroke-width="2"/>
  <text x="485" y="212" text-anchor="middle" font-size="17" font-weight="700" fill="#5a4300">Cloud Messaging (push)</text>

  <!-- Stripe + serverless -->
  <rect x="360" y="290" width="250" height="60" rx="12" fill="#ecebff" stroke="#8b86f0" stroke-width="2"/>
  <text x="485" y="316" text-anchor="middle" font-size="17" font-weight="700" fill="#2c2780">Vercel functions (web)</text>
  <text x="485" y="337" text-anchor="middle" font-size="12.5" fill="#2c2780">/api/checkout_session · /api/refund</text>
  <rect x="360" y="380" width="250" height="60" rx="12" fill="#ecebff" stroke="#8b86f0" stroke-width="2"/>
  <text x="485" y="406" text-anchor="middle" font-size="17" font-weight="700" fill="#2c2780">Cloud Function</text>
  <text x="485" y="427" text-anchor="middle" font-size="12.5" fill="#2c2780">processRefund</text>

  <rect x="700" y="300" width="170" height="120" rx="14" fill="#635BFF"/>
  <text x="785" y="352" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">Stripe</text>
  <text x="785" y="378" text-anchor="middle" font-size="13" fill="#e6e4ff">payments and refunds</text>

  <!-- arrows -->
  <path d="M260 200 L360 46" stroke="#6b5b5c" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M260 220 L360 126" stroke="#6b5b5c" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M260 240 L360 206" stroke="#6b5b5c" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M260 270 L360 318" stroke="#6b5b5c" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M610 320 L700 340" stroke="#6b5b5c" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M610 410 L700 392" stroke="#6b5b5c" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M360 410 L145 410 L145 312" stroke="#6b5b5c" stroke-width="2" fill="none" marker-start="url(#a)" stroke-dasharray="6 5"/>
  <text x="150" y="400" font-size="12.5" fill="#6b5b5c">called when an admin approves a refund</text>
  <text x="30" y="458" font-size="13" fill="#6b5b5c">On a phone, the app also pays Stripe directly. On the web it goes through the Vercel functions.</text>
</svg>
