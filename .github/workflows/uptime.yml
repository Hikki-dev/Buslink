name: Demo health check

# Free and tiny: one 10-second job every 6 hours. It checks the page AND the
# compiled app file, so a "READY but blank" deploy (failed Flutter compile)
# turns this badge red. GitHub emails you when a scheduled run fails.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      SITE: https://buslink-eta.vercel.app
    steps:
      - name: Page loads
        run: curl -fsS --retry 3 --retry-delay 5 -o /dev/null "$SITE/"
      - name: App bundle exists (catches a blank site)
        run: |
          curl -fsS --retry 3 --retry-delay 5 -o /tmp/main.js "$SITE/main.dart.js"
          test "$(wc -c < /tmp/main.js)" -gt 1000000
