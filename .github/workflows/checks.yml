name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Make the git-ignored files with fake values
        run: bash demo/prepare.sh
      - run: flutter pub get
      - name: Analyze (errors only)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build the web app
        run: flutter build web --release --no-web-resources-cdn
      - name: Check the demo scripts
        run: |
          bash -n demo/prepare.sh
          bash -n demo/seed.sh
          node --check demo/seed-emulator.js
